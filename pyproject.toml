[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homey-esphomedriver"
version = "0.3.0"
description = "Shared ESPHome client, entity mapping, and pairing for Homey apps"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abe Haverkamp", email = "abe.haverkamp@gmail.com" }]
keywords = ["esphome", "homey", "iot", "smart-home"]
dependencies = [
    "aioesphomeapi>=45.8.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.scripts]
esphome-homey = "homey_esphomedriver.bootstrap:main"

[project.urls]
Homepage = "https://github.com/Doekse/homey-esphomedriver"
Repository = "https://github.com/Doekse/homey-esphomedriver"
Issues = "https://github.com/Doekse/homey-esphomedriver/issues"
Changelog = "https://github.com/Doekse/homey-esphomedriver/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "homey-stubs>=0.0.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homey_esphomedriver = ["py.typed", "homey_template/**/*"]

[tool.ruff]
target-version = "py314"
src = ["src"]
extend-exclude = ["src/homey_esphomedriver/homey_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
